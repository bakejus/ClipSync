openapi: 3.0.0
info:
  title: ClipSync REST API
  description: Vaizdo įrašų, komentarų ir medijos klipų platformos API su JWT autentifikacija
  version: 2.0.0
servers:
  - url: http://localhost:3000
    description: Local serveris

tags:
  - name: Auth
    description: Autentifikacija ir žetonų valdymas (Register, Login, Refresh, Logout)
  - name: Users
    description: Naudotojų valdymas (Tik Admin rolei)
  - name: Videos
    description: Vaizdo įrašų valdymas
  - name: Comments
    description: Komentarų valdymas ir hierarchija
  - name: Clips
    description: Komentarų medijos klipų valdymas ir hierarchija

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Įveskite prisijungimo metu gautą accessToken

  schemas:
    RegisterInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: "Naujas"
        email:
          type: string
          example: "narys@ktu.lt"
        password:
          type: string
          example: "slaptazodis123"
        role:
          type: string
          enum: [member, admin]
          example: "member"
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: "Tomas_KTU"
        password:
          type: string
          example: "slaptazodis123"
    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    VideoInput:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
          example: "Naujas mokomasis video"
        description:
          type: string
          example: "Trumpas video aprašymas"
        url:
          type: string
          example: "https://youtube.com/watch?v=99999"
    CommentInput:
      type: object
      required: [content]
      properties:
        author:
          type: string
          example: "Tomas_KTU"
        content:
          type: string
          example: "Labai geras video, pridedu klipą!"
    ClipInput:
      type: object
      required: [media_type, media_url]
      properties:
        media_type:
          type: string
          enum: [image, video_clip]
          example: "video_clip"
        media_url:
          type: string
          example: "https://imgur.com/my-clip.mp4"
        timestamp_sec:
          type: integer
          example: 65

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registruoti naują naudotoją
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Naudotojas užregistruotas
        '409':
          description: Naudotojas jau egzistuoja
        '422':
          description: Trūksta privalomų laukų

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Prisijungti ir gauti Access bei Refresh žetonus (JWT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Sėkmingai prisijungta (grąžina accessToken ir refreshToken)
        '401':
          description: Neteisingi prisijungimo duomenys

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Atnaujinti Access žetoną naudojant Refresh žetoną
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: Sugeneruotas naujas accessToken
        '401':
          description: Trūksta refreshToken
        '403':
          description: Refresh žetonas nebegalioja

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Atsijungti ir panaikinti naudotojo Refresh žetoną
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sėkmingai atsijungta
        '401':
          description: Neprisijungęs naudotojas

  /api/users:
    get:
      tags: [Users]
      summary: "Gauti visų registruotų naudotojų sąrašą"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Naudotojų sąrašas
        '401':
          description: Neprisijungęs naudotojas
        '403':
          description: Nepakanka teisių (reikalinga admin rolė)

  /api/videos:
    get:
      tags: [Videos]
      summary: 1. Gauti visų vaizdo įrašų sąrašą
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Sėkmingai grąžintas sąrašas
    post:
      tags: [Videos]
      summary: 2. Sukurti naują vaizdo įrašą (Member / Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoInput'
      responses:
        '201':
          description: Vaizdo įrašas sukurtas
        '401':
          description: Neprisijungęs naudotojas
        '422':
          description: Trūksta privalomų laukų

  /api/videos/{id}:
    get:
      tags: [Videos]
      summary: 3. Gauti konkretų vaizdo įrašą pagal ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vaizdo įrašas rastas
        '400':
          description: Neteisingas ID formatas
        '404':
          description: Vaizdo įrašas nerastas
    put:
      tags: [Videos]
      summary: 4. Atnaujinti vaizdo įrašą (Tik savininkas pagal ID arba Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoInput'
      responses:
        '200':
          description: Vaizdo įrašas atnaujintas
        '401':
          description: Neprisijungęs naudotojas
        '403':
          description: Draudžiama keisti svetimą įrašą
        '404':
          description: Vaizdo įrašas nerastas
    delete:
      tags: [Videos]
      summary: 5. Ištrinti vaizdo įrašą (Tik savininkas pagal ID arba Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Sėkmingai ištrinta
        '401':
          description: Neprisijungęs naudotojas
        '403':
          description: Draudžiama trinti svetimą įrašą
        '404':
          description: Vaizdo įrašas nerastas

  /api/videos/{videoId}/comments:
    get:
      tags: [Comments]
      summary: 6. Gauti visus konkretaus vaizdo įrašo komentarus
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Komentarų sąrašas grąžintas
        '404':
          description: Vaizdo įrašas nerastas
    post:
      tags: [Comments]
      summary: 7. Pridėti komentarą prie konkretaus vaizdo įrašo (Member / Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Komentaras sukurtas
        '401':
          description: Neprisijungęs naudotojas
        '404':
          description: Vaizdo įrašas nerastas
        '422':
          description: Trūksta privalomų laukų

  /api/comments/{id}:
    get:
      tags: [Comments]
      summary: 8. Gauti vieną komentarą pagal ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Komentaras rastas
        '404':
          description: Komentaras nerastas
    put:
      tags: [Comments]
      summary: 9. Atnaujinti komentarą (Tik savininkas pagal ID arba Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '200':
          description: Komentaras atnaujintas
        '401':
          description: Neprisijungęs naudotojas
        '403':
          description: Draudžiama redaguoti kito naudotojo komentarą
        '404':
          description: Komentaras nerastas
    delete:
      tags: [Comments]
      summary: 10. Ištrinti komentarą (Tik savininkas pagal ID arba Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Sėkmingai ištrinta
        '401':
          description: Neprisijungęs naudotojas
        '403':
          description: Draudžiama trinti kito naudotojo komentarą
        '404':
          description: Komentaras nerastas

  /api/comments/{commentId}/clips:
    get:
      tags: [Clips]
      summary: 11. Gauti visus konkretaus komentaro klipus (su filtravimu)
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
        - name: media_type
          in: query
          required: false
          schema:
            type: string
            enum: [image, video_clip]
      responses:
        '200':
          description: Klipų sąrašas grąžintas
        '404':
          description: Komentaras nerastas
    post:
      tags: [Clips]
      summary: 12. Pridėti klipą prie konkretaus komentaro (Member / Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipInput'
      responses:
        '201':
          description: Klipas sukurtas
        '401':
          description: Neprisijungęs naudotojas
        '404':
          description: Komentaras nerastas
        '422':
          description: Neteisingi arba trūkstami laukai

  /api/clips/{id}:
    get:
      tags: [Clips]
      summary: 13. Gauti vieną klipą pagal ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Klipas rastas
        '404':
          description: Klipas nerastas
    put:
      tags: [Clips]
      summary: 14. Atnaujinti klipą (Tik savininkas pagal ID arba Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipInput'
      responses:
        '200':
          description: Klipas atnaujintas
        '401':
          description: Neprisijungęs naudotojas
        '403':
          description: Draudžiama redaguoti svetimą klipą
        '404':
          description: Klipas nerastas
    delete:
      tags: [Clips]
      summary: 15. Ištrinti klipą (Tik savininkas pagal ID arba Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Sėkmingai ištrinta
        '401':
          description: Neprisijungęs naudotojas
        '403':
          description: Draudžiama trinti svetimą klipą
        '404':
          description: Klipas nerastas

  /api/videos/{id}/dashboard:
    get:
      tags: [Videos]
      summary: 16. Video suvestinė (Dashboard), sukonstruotą iš kelių esybių
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sėkmingai sukonstruota suvestinė iš Video, Comments ir Clips
        '400':
          description: Neteisingas ID formatas
        '404':
          description: Vaizdo įrašas nerastas
